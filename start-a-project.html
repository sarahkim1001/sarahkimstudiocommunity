<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Start a project with Sarah Kim Studio — spatial experience, creative documentation, and digital strategy for cultural institutions.">
  <title>Start a Project | Sarah Kim Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-nav-active="contact">
  <div class="layout-wrapper">

    <header class="site-header">
      <div data-site-nav></div>
    </header>

    <main class="site-main site-main--contact">
      <div class="layout-container contact-layout">
        <h1 class="contact-headline">Tell me about the space, story, or system you&rsquo;re building&mdash;and how we might shape it together.</h1>

        <form class="contact-form" action="mailto:sarahkim1001@gmail.com" method="post" enctype="text/plain">
          <div class="contact-form__row">
            <label class="contact-form__label" for="contact-name">Your Name<span class="contact-form__required" aria-hidden="true">*</span></label>
            <input class="contact-form__input" type="text" id="contact-name" name="name" required autocomplete="name" placeholder="Full name">
          </div>

          <div class="contact-form__row">
            <label class="contact-form__label" for="contact-email">Email Address<span class="contact-form__required" aria-hidden="true">*</span></label>
            <input class="contact-form__input" type="email" id="contact-email" name="email" required autocomplete="email" placeholder="you@studio.com">
          </div>

          <div class="contact-form__row">
            <label class="contact-form__label" for="contact-project">About Your Project<span class="contact-form__required" aria-hidden="true">*</span></label>
            <textarea class="contact-form__input contact-form__textarea" id="contact-project" name="project" rows="6" required placeholder="Scope, timeline, and what you're hoping to create"></textarea>
          </div>

          <div class="contact-form__row contact-form__row--optional">
            <label class="contact-form__label" for="contact-budget">Estimated Budget</label>
            <input class="contact-form__input" type="text" id="contact-budget" name="budget" placeholder="Optional">
          </div>

          <div class="contact-form__actions">
            <button class="contact-form__submit" type="submit">Submit Inquiry</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="layout-container site-footer__inner">
        <div data-footer-contacts></div>
        <p class="site-footer__copy">2026 Sarah Kim Studio.</p>
      </div>
    </footer>

  </div>
  <script src="js/site-root.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/footer-contacts.js"></script>
</body>
</html>
