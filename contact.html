<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Sarah Kim — open to roles, collaborations, and conversations about design, storytelling, and creative marketing.">
  <title>Contact | Sarah Kim</title>
  <link rel="stylesheet" href="style.css?v=2026-09-25">
</head>
<body data-nav-active="contact">
  <div class="layout-wrapper">

    <header class="site-header">
      <div data-site-nav></div>
    </header>

    <main class="site-main site-main--contact">
      <div class="layout-container contact-layout">
        <h1 class="contact-headline">Whether you&rsquo;re hiring, collaborating, or just saying hi&mdash;I&rsquo;d love to hear from you.</h1>

        <form class="contact-form" action="mailto:sarahkim1001@gmail.com" method="post" enctype="text/plain">
          <div class="contact-form__row">
            <label class="contact-form__label" for="contact-name">Your Name<span class="contact-form__required" aria-hidden="true">*</span></label>
            <input class="contact-form__input" type="text" id="contact-name" name="name" required autocomplete="name" placeholder="Full name">
          </div>

          <div class="contact-form__row">
            <label class="contact-form__label" for="contact-email">Email Address<span class="contact-form__required" aria-hidden="true">*</span></label>
            <input class="contact-form__input" type="email" id="contact-email" name="email" required autocomplete="email" placeholder="you@company.com">
          </div>

          <div class="contact-form__row">
            <label class="contact-form__label" for="contact-message">Message<span class="contact-form__required" aria-hidden="true">*</span></label>
            <textarea class="contact-form__input contact-form__textarea" id="contact-message" name="message" rows="6" required placeholder="A role, a collaboration, or just hello"></textarea>
          </div>

          <div class="contact-form__actions">
            <p class="contact-form__fallback">Or email me directly at <a class="text-link" href="mailto:sarahkim1001@gmail.com">sarahkim1001@gmail.com</a></p>
            <button class="contact-form__submit" type="submit">Send</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div class="layout-container site-footer__inner">
        <div data-footer-contacts></div>
        <p class="site-footer__copy">2026 Sarah Kim.</p>
      </div>
    </footer>

  </div>
  <script src="js/site-root.js"></script>
  <script src="js/nav.js?v=2026-09-25"></script>
  <script src="js/footer-contacts.js?v=2026-09-25"></script>
  <script>
    document.querySelector(".contact-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const name = form.elements.name.value.trim();
      const email = form.elements.email.value.trim();
      const message = form.elements.message.value.trim();
      const subject = `Hello from ${name}`;
      const body = `${message}\n\n${name}\n${email}`;
      window.location.href = `mailto:sarahkim1001@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    });
  </script>
</body>
</html>
